[project]
name = "drug-matching-benchmark"
version = "0.1.0"
description = "Benchmark for matching commercial drug product descriptions (FDA NDC) to normalized clinical drugs (RxNorm SCD)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Jairo Pozo" }]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "polars>=1.20",
    "rapidfuzz>=3.10",
    "scikit-learn>=1.5",
    "truststore>=0.10",
]

[project.scripts]
dmb = "dmb.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
explore = ["jupyterlab>=4.3"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmb"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
